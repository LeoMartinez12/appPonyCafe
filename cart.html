<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PonyCafe - Carrito POS</title>
  <link rel="icon" type="image/jpeg" href="PonyCafe_LOGO.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-container">

  <header class="app-header">
    <div class="brand-wrapper">
      <a href="index.html" class="brand-home-link">
        <img src="PonyCafe_LOGO.jpg" alt="PonyCafe" class="brand-logo">
      </a>
      <div class="header-titles">
        <h1 class="site-title"><a href="index.html" class="title-link">PonyCafe</a></h1>
        <p class="site-subtitle">POS Campus Universitario</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="catalog.html" class="btn-back">← Volver al Catálogo</a>
    </div>
  </header>

  <div class="page-header">
    <div>
      <span class="badge-order">Punto de Cobro</span>
      <h2 class="page-title">Carrito de Compras</h2>
    </div>
    <span class="order-item-count">0 artículos en la orden</span>
  </div>

  <main class="cart-layout">
    <section class="cart-items-section">
      <div class="loading-state">Cargando carrito...</div>
    </section>

    <section class="summary-section">
      <div class="summary-panel">
        <h3 class="summary-title">Resumen de Cuenta</h3>

        <div class="summary-details">
          <div class="summary-row">
            <span>Subtotal</span>
            <span class="summary-value" id="summary-subtotal">$0.00</span>
          </div>

          <div class="summary-row discount-row">
            <label class="discount-toggle-label">
              <input type="checkbox" id="student-discount-check" checked>
              <span>Descuento Estudiante (10%)</span>
            </label>
            <span class="summary-value discount" id="summary-discount">-$0.00</span>
          </div>

          <div class="summary-row">
            <span>Impuestos (IVA 16%)</span>
            <span class="summary-value" id="summary-tax">$0.00</span>
          </div>

          <div class="summary-row total-row">
            <span class="total-label">Total a Pagar</span>
            <span class="total-value" id="summary-total">$0.00</span>
          </div>
        </div>

        <div class="payment-section">
          <label class="payment-label">Método de Pago</label>
          <div class="payment-methods">
            <button class="btn-payment active">Efectivo</button>
            <button class="btn-payment">Tarjeta</button>
            <button class="btn-payment">PonyPay</button>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn-checkout">
            <span>Cobrar y Procesar</span> →
          </button>
          <button class="btn-clear">
            Vaciar Carrito
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
