<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PonyCafe - Catálogo POS</title>
  <link rel="icon" type="image/jpeg" href="PonyCafe_LOGO.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-container">

  <header class="app-header">
    <div class="brand-wrapper">
      <a href="index.html" class="brand-home-link">
        <img src="PonyCafe_LOGO.jpg" alt="PonyCafe" class="brand-logo">
      </a>
      <div class="header-titles">
        <h1 class="site-title"><a href="index.html" class="title-link">PonyCafe</a></h1>
        <p class="site-subtitle">POS Campus Universitario</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn-back">← Inicio</a>
      <a href="cart.html" class="btn-cart-link cart-badge-target">🛒 0 items</a>
    </div>
  </header>

  <section class="toolbar-section">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="catalog-search" class="search-input" placeholder="Buscar por nombre o descripción...">
    </div>
  </section>

  <nav class="category-nav">
    <button class="btn-category active" data-category="todos">Todos</button>
    <button class="btn-category" data-category="cafe">Café</button>
    <button class="btn-category" data-category="panaderia">Panadería</button>
    <button class="btn-category" data-category="bebidas">Bebidas</button>
    <button class="btn-category" data-category="snacks">Snacks</button>
  </nav>

  <main class="product-grid">
    <div class="loading-state">Cargando menú de PonyCafe...</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
